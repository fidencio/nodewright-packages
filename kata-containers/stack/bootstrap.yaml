apiVersion: v1
kind: Namespace
metadata:
  name: node-feature-discovery
---
apiVersion: v1
kind: Namespace
metadata:
  name: kata-device-plugin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kata-stack-installer
  namespace: nodewright
---
apiVersion: v1
kind: Secret
metadata:
  name: kata-stack-installer-token
  namespace: nodewright
  annotations:
    kubernetes.io/service-account.name: kata-stack-installer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kata-stack-installer-cluster
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - nodes/status
  verbs:
  - get
  - list
  - watch
  - patch
  - update
- apiGroups:
  - ''
  resources:
  - namespaces
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - nfd.k8s-sigs.io
  resources:
  - nodefeatures
  - nodefeaturerules
  - nodefeaturegroups
  - nodefeaturegroups/status
  verbs: &id001
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - topology.node.k8s.io
  resources:
  - noderesourcetopologies
  verbs:
  - list
  - delete
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  - clusterrolebindings
  verbs: *id001
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs: *id001
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kata-stack-installer-writer
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  - configmaps
  - serviceaccounts
  - services
  - endpoints
  - events
  verbs: &id001
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  - daemonsets
  - replicasets
  verbs: *id001
- apiGroups:
  - batch
  resources:
  - jobs
  verbs: *id001
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs: *id001
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs: *id001
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kata-stack-installer-cluster
subjects:
- kind: ServiceAccount
  name: kata-stack-installer
  namespace: nodewright
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kata-stack-installer-cluster
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kata-stack-installer-writer
  namespace: node-feature-discovery
subjects:
- kind: ServiceAccount
  name: kata-stack-installer
  namespace: nodewright
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kata-stack-installer-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kata-stack-installer-writer
  namespace: kata-device-plugin
subjects:
- kind: ServiceAccount
  name: kata-stack-installer
  namespace: nodewright
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kata-stack-installer-writer
