apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  name: kata-gpu-off
  labels:
    nodewright.nvidia.com/kata-stack: 'true'
spec:
  nodeSelectors:
    matchLabels:
      kubernetes.io/os: linux
      nodewright.nvidia.com/kata-profile: kata-gpu-off
    matchExpressions:
    - key: kubernetes.io/arch
      operator: In
      values:
      - amd64
      - arm64
  interruptionBudget:
    count: 1
  packages:
    kata-containers:
      image: ghcr.io/fidencio/kata-containers/test-images
      version: 4.3.1
      interrupt:
        type: noop
      configInterrupts:
        '*':
          type: noop
      uninstall:
        enabled: true
        apply: false
      gracefulShutdown: 10m
      resources:
        cpuRequest: 250m
        cpuLimit: '1'
        memoryRequest: 256Mi
        memoryLimit: 1Gi
      env:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: spec.nodeName
      - name: CONTAINERD_CONFIG_FILE_NAME
        value: config.toml
      - name: DEBUG
        value: 'false'
      - name: KATA_RUNTIME
        value: qemu-nvidia-gpu-runtime-rs
      - name: KATA_STACK_NAME
        value: kata-gpu-off
      - name: KATA_STACK_NAMESPACE
        value: nodewright
      - name: KATA_STACK_API_HOST
        value: $(KUBERNETES_SERVICE_HOST)
      - name: KATA_STACK_API_PORT
        value: $(KUBERNETES_SERVICE_PORT)
      - name: KATA_STACK_TOKEN
        valueFrom:
          secretKeyRef:
            name: kata-stack-installer-token
            key: token
      - name: KATA_STACK_CA
        valueFrom:
          secretKeyRef:
            name: kata-stack-installer-token
            key: ca.crt
      configMap:
        containerd-user-dropin.toml: "[plugins.'io.containerd.snapshotter.v1.erofs']\n\
          \  enable_fsverity = false\n"
      containerSHA: sha256:85f46f0254d99ec1eb539c30b95c7d3f9ba29178e924fbf69040336f877bf220
      stageTimeout: 45m
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-containers-qemu-nvidia-gpu-runtime-rs
handler: kata-qemu-nvidia-gpu-runtime-rs
scheduling:
  nodeSelector:
    kubernetes.io/os: linux
    nodewright.nvidia.com/kata-runtime-ready: kata-qemu-nvidia-gpu-runtime-rs
    nvidia.com/cc.ready.state: 'false'
