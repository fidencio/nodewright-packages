# Install and wait for the shared NFD release first; never deploy a nested copy.
node-feature-discovery:
  enabled: false
profiles:
  gpu:
    enabled: true
    ccMode: "off"
    ccModeStateLabel: nodewright.nvidia.com/kata-gpu-mode
    nodeFeatureRule:
      enabled: true
    nodeSelector:
      nodewright.nvidia.com/kata-profile: kata-containers-gpu
      kubernetes.io/os: linux
      kata.feature.node.kubernetes.io/nvidia-gpu: "true"
    job:
      parallelism: 1
