apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  name: kata-containers-gpu
spec:
  nodeSelectors:
    matchLabels:
      nodewright.nvidia.com/kata-profile: kata-containers-gpu
      kubernetes.io/os: linux
      nodewright.nvidia.com/kata-gpu-mode: "off"
      nvidia.com/cc.ready.state: "false"
      kata.feature.node.kubernetes.io/nvidia-gpu: "true"
    matchExpressions:
    - key: kubernetes.io/arch
      operator: In
      values:
      - amd64
      - arm64
  interruptionBudget:
    count: 1
  packages:
    kata-containers:
      image: ghcr.io/nvidia/nodewright-packages/kata-containers
      version: 4.3.1
      interrupt:
        type: noop
      configInterrupts:
        '*':
          type: noop
      uninstall:
        enabled: true
        apply: false
      gracefulShutdown: 10m
      resources:
        cpuRequest: 250m
        cpuLimit: '1'
        memoryRequest: 256Mi
        memoryLimit: 1Gi
      env:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: spec.nodeName
      - name: CONTAINERD_CONFIG_FILE_NAME
        value: config.toml
      - name: DEBUG
        value: 'false'
      - name: KATA_RUNTIME
        value: qemu-nvidia-gpu-runtime-rs
      configMap:
        containerd-user-dropin.toml: |
          [plugins.'io.containerd.snapshotter.v1.erofs']
            enable_fsverity = false
