# Clear the upstream selector: finite NodeWright stages do not write this label.
nodeSelector:
  katacontainers.io/kata-runtime: null
  kubernetes.io/os: linux
  nodewright.nvidia.com/status_kata-containers-gpu: complete

# Workloads request the stable nvidia.com/gpu resource name.
resourceNaming: alias
